services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pixelgo
      POSTGRES_PASSWORD: pixelgo
      POSTGRES_DB: pixelgo
    ports:
      - "5432:5432"
    volumes:
      - pixelgo-postgres:/var/lib/postgresql/data
      - ./postgres/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelgo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - pixelgo-redis:/data

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pixelgo
      MINIO_ROOT_PASSWORD: pixelgo-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pixelgo-minio:/data

volumes:
  pixelgo-postgres:
  pixelgo-redis:
  pixelgo-minio:
