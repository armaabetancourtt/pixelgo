apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pixelgo-api-ingress
spec:
  podSelector:
    matchLabels:
      app: pixelgo-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
