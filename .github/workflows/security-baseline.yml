name: Security baseline
on:
  push:
    paths: ['.github/workflows/security-baseline.yml','analytics/**','pipelines/**','ml/**','models/**','infrastructure/**']
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
