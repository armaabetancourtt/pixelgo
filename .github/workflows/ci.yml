name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate OpenAPI structure
        run: npx --yes @redocly/cli@1.34.2 lint contracts/openapi.yaml --config .redocly.yaml

      - name: Reject breaking API changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git show "${{ github.event.pull_request.base.sha }}:contracts/openapi.yaml" > /tmp/base-openapi.yaml
          docker run --rm             -v "${{ github.workspace }}:/repo"             -v "/tmp:/tmp"             tufin/oasdiff:latest             breaking /tmp/base-openapi.yaml /repo/contracts/openapi.yaml

  backend:
    name: Go + PostgreSQL + Redis backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pixelgo
          POSTGRES_PASSWORD: pixelgo
          POSTGRES_DB: pixelgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixelgo -d pixelgo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pixelgo:pixelgo@127.0.0.1:5432/pixelgo?sslmode=disable
      PIXELGO_AUTO_MIGRATE: "true"
      REDIS_URL: redis://127.0.0.1:6379/0
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Resolve module graph
        run: |
          go mod tidy
          cat go.sum

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

      - name: Build API binary
        run: go build -trimpath -o /tmp/pixelgo-api ./cmd/api

      - name: Binary E2E + persistence across restart
        shell: bash
        run: |
          start_api() {
            /tmp/pixelgo-api > /tmp/pixelgo-api.log 2>&1 &
            API_PID=$!
            for i in {1..30}; do
              if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
                return 0
              fi
              sleep 1
            done
            cat /tmp/pixelgo-api.log
            return 1
          }

          stop_api() {
            if [ -n "${API_PID:-}" ]; then
              kill "$API_PID" || true
              wait "$API_PID" || true
            fi
          }

          trap stop_api EXIT

          start_api
          python3 ../tests/e2e/transfer_flow.py

          stop_api
          API_PID=""
          start_api

          python3 - <<'PY'
          import json
          import urllib.request

          def get(path):
              with urllib.request.urlopen("http://127.0.0.1:8080" + path, timeout=3) as response:
                  return json.loads(response.read())

          devices = get("/v1/devices")
          transfers = get("/v1/transfers")

          assert len(devices) >= 2, devices
          assert any(item["status"] == "completed" for item in transfers), transfers
          print("PASS: PostgreSQL state survives API restart")
          PY

  android:
    name: Android · Kotlin / Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle -p android --no-daemon :app:testDebugUnitTest

      - name: Debug build
        run: gradle -p android --no-daemon :app:assembleDebug

  ios:
    name: iOS · Swift / SwiftUI
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build and test
        working-directory: ios
        run: |
          xcodebuild             -project PixelGo.xcodeproj             -scheme PixelGo             -destination 'platform=macOS,arch=arm64'             CODE_SIGNING_ALLOWED=NO             test

  docker:
    name: Backend container
    runs-on: ubuntu-latest
    needs: [contract, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          tags: pixelgo-api:ci
