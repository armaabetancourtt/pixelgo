name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Push events can be delivered out of order. Keying by commit keeps an older
  # delayed run from cancelling validation for a newer repository state.
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  workflows:
    name: GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Lint workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate OpenAPI structure
        run: npx --yes @redocly/cli@1.34.2 lint contracts/openapi.yaml --config .redocly.yaml

      - name: Reject breaking API changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git show "${{ github.event.pull_request.base.sha }}:contracts/openapi.yaml" > /tmp/base-openapi.yaml
          docker run --rm             -v "${{ github.workspace }}:/repo"             -v "/tmp:/tmp"             tufin/oasdiff:latest             breaking /tmp/base-openapi.yaml /repo/contracts/openapi.yaml

  backend:
    name: Go + PostgreSQL + Redis backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pixelgo
          POSTGRES_PASSWORD: pixelgo
          POSTGRES_DB: pixelgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixelgo -d pixelgo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pixelgo:pixelgo@127.0.0.1:5432/pixelgo?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      PIXELGO_AUTO_MIGRATE: "true"
      PIXELGO_REQUIRE_AUTH: "true"
      PIXELGO_JWT_SECRET: "ci-only-jwt-secret-0123456789abcdef"
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_BUCKET: pixelgo
      OBJECT_STORAGE_ACCESS_KEY: pixelgo
      OBJECT_STORAGE_SECRET_KEY: pixelgo-ci-secret
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_PREFIX: transfers
      OBJECT_STORAGE_AUTO_CREATE: "true"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Start MinIO object storage
        shell: bash
        run: |
          docker run --rm -d \
            --name pixelgo-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=pixelgo \
            -e MINIO_ROOT_PASSWORD=pixelgo-ci-secret \
            quay.io/minio/minio server /data

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            echo "waiting for MinIO (${attempt}/30)"
            sleep 1
          done

          docker logs pixelgo-minio
          exit 1

      - name: Resolve module graph
        run: |
          go mod tidy
          cat go.sum

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

      - name: Build API binary
        run: go build -trimpath -o /tmp/pixelgo-api ./cmd/api

      - name: Binary E2E + persistence across restart
        shell: bash
        run: |
          start_api() {
            /tmp/pixelgo-api > /tmp/pixelgo-api.log 2>&1 &
            API_PID=$!
            for attempt in {1..30}; do
              if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
                return 0
              fi
              echo "waiting for API (${attempt}/30)"
              sleep 1
            done
            cat /tmp/pixelgo-api.log
            return 1
          }

          stop_api() {
            if [ -n "${API_PID:-}" ]; then
              kill "$API_PID" || true
              wait "$API_PID" || true
            fi
          }

          trap stop_api EXIT

          start_api

          curl --fail --silent -D /tmp/health-headers.txt \
            http://127.0.0.1:8080/health >/dev/null
          grep -qi '^X-Request-ID:' /tmp/health-headers.txt

          curl --fail --silent http://127.0.0.1:8080/ready \
            | grep -q '"status":"ready"'

          python3 ../tests/e2e/transfer_flow.py

          curl --fail --silent http://127.0.0.1:8080/metrics \
            | grep -q 'pixelgo_http_requests_total'

          stop_api
          API_PID=""
          grep -q '"msg":"pixelgo api stopped"' /tmp/pixelgo-api.log
          echo "PASS: SIGTERM drained API cleanly"

          start_api

          python3 - <<'PY'
          import json
          import urllib.request

          def request(method, path, body=None, token=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  "http://127.0.0.1:8080" + path,
                  data=data,
                  method=method,
              )
              req.add_header("Accept", "application/json")
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              if token is not None:
                  req.add_header("Authorization", "Bearer " + token)
              with urllib.request.urlopen(req, timeout=3) as response:
                  raw = response.read()
                  return None if not raw else json.loads(raw)

          login = request(
              "POST",
              "/v1/auth/login",
              {
                  "email": "e2e-primary@pixelgo.local",
                  "password": "correct-horse-battery-staple-e2e",
              },
          )
          token = login["accessToken"]
          devices = request("GET", "/v1/devices", token=token)
          transfers = request("GET", "/v1/transfers", token=token)

          assert len(devices) == 2, devices
          assert len(transfers) >= 1, transfers
          assert any(item["status"] == "completed" for item in transfers), transfers
          print("PASS: authenticated PostgreSQL + MinIO state survives API restart")
          PY

  android:
    name: Android · Kotlin / Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle -p android --no-daemon :app:testDebugUnitTest

      - name: Debug build
        run: gradle -p android --no-daemon :app:assembleDebug

  ios:
    name: iOS · Swift / SwiftUI
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Compile native iOS app and XCTest bundle
        working-directory: ios
        run: |
          xcodebuild \
            -project PixelGo.xcodeproj \
            -scheme PixelGo \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Execute Swift contract tests
        working-directory: ios
        run: swift test

  docker:
    name: Backend container
    runs-on: ubuntu-latest
    needs: [contract, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          tags: pixelgo-api:ci
