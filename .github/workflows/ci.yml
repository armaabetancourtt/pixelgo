name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@1.34.2 lint contracts/openapi.yaml

      - name: Reject breaking API changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git show "${{ github.event.pull_request.base.sha }}:contracts/openapi.yaml" > /tmp/base-openapi.yaml
          docker run --rm             -v "${{ github.workspace }}:/repo"             -v "/tmp:/tmp"             tufin/oasdiff:latest             breaking /tmp/base-openapi.yaml /repo/contracts/openapi.yaml

  backend:
    name: Go backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

      - name: E2E API lifecycle
        shell: bash
        run: |
          go run ./cmd/api > /tmp/pixelgo-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            sleep 1
          done
          python3 ../tests/e2e/transfer_flow.py

  android:
    name: Android · Kotlin / Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle -p android --no-daemon :app:testDebugUnitTest

      - name: Debug build
        run: gradle -p android --no-daemon :app:assembleDebug

  ios:
    name: iOS · Swift / SwiftUI
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build and test
        working-directory: ios
        run: |
          xcodebuild             -project PixelGo.xcodeproj             -scheme PixelGo             -sdk iphonesimulator             -destination 'platform=iOS Simulator,name=iPhone 16 Pro'             CODE_SIGNING_ALLOWED=NO             test

  docker:
    name: Backend container
    runs-on: ubuntu-latest
    needs: [contract, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          tags: pixelgo-api:ci
