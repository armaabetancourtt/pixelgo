name: Release candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  backend:
    name: Backend image artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pixelgo-api:${GITHUB_REF_NAME} server
      - run: docker save pixelgo-api:${GITHUB_REF_NAME} | gzip > pixelgo-api.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pixelgo-api-${{ github.ref_name }}
          path: pixelgo-api.tar.gz

  android:
    name: Android bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle -p android --no-daemon :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: pixelgo-android-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/*.aab

  ios:
    name: iOS unsigned archive
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - working-directory: ios
        run: xcodegen generate
      - name: Archive without signing
        working-directory: ios
        run: |
          xcodebuild             -project PixelGo.xcodeproj             -scheme PixelGo             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "${{ github.workspace }}/PixelGo.xcarchive"             CODE_SIGNING_ALLOWED=NO             archive
          tar -czf "${{ github.workspace }}/PixelGo.xcarchive.tar.gz"             -C "${{ github.workspace }}" PixelGo.xcarchive
      - uses: actions/upload-artifact@v4
        with:
          name: pixelgo-ios-${{ github.ref_name }}
          path: PixelGo.xcarchive.tar.gz
